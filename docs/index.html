<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>My Smart Latex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Smart Latex</h1>
    <button id="signout" type="button" hidden>Sign out</button>
  </header>

  <main>
    <section id="login">
      <h2>Bank transactions</h2>
      <p>Sign in with Google to read the transaction sheets. The data is loaded straight from your Google Drive into this page and is not stored anywhere.</p>
      <button id="signin" class="primary" type="button" disabled>Sign in with Google</button>
      <p id="login-msg" role="alert"></p>
    </section>

    <section id="app" hidden>
      <div class="controls">
        <label>Year
          <select id="year"></select>
        </label>
        <label>Sheet
          <select id="sheet"></select>
        </label>
        <label class="grow">Filter
          <input id="filter" type="search" placeholder="Search rows" autocomplete="off">
        </label>
      </div>
      <p id="status" role="status"></p>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
